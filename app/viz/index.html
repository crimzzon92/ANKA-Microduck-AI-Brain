<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A.N.K.A. – brain view</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #090c14; color: #dfe6f3;
               font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 22px 32px; box-sizing: border-box; height: 100%;
          display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: baseline;
           border-bottom: 1px solid #1d2638; padding-bottom: 14px; }
  h1 { margin: 0; font-size: 34px; letter-spacing: 2px; font-weight: 600; }
  .mode { font-family: Menlo, monospace; font-size: 12px; letter-spacing: 1px; color: #8fa3c4; }
  .mode b { color: #ffd479; font-weight: 500; }
  canvas { flex: 1; width: 100%; min-height: 320px; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px 28px; border-top: 1px solid #1d2638; padding-top: 12px; }
  .legend span { display: flex; align-items: center; gap: 8px; font-size: 15px; color: #9aa7bd; transition: color .3s; }
  .legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .status { font-size: 19px; margin: 14px 0 10px; min-height: 26px; }
  .bar { display: flex; justify-content: space-between; border-top: 1px solid #1d2638; padding-top: 10px;
         font-size: 12px; color: #6f7f9b; }
  button { background: #141b2b; color: #cfd8ea; border: 1px solid #2a3550; border-radius: 6px; padding: 5px 12px;
           font-size: 12px; cursor: pointer; }
  button.on { border-color: #ffd479; color: #ffd479; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>A.N.K.A.</h1>
    <div class="mode" id="mode">LIVE</div>
  </header>
  <canvas id="c"></canvas>
  <div class="legend" id="legend"></div>
  <div class="status" id="status">Waiting for ANKA…</div>
  <div class="bar">
    <span id="info">Reads viz/activity.json – written by ANKA while he runs.</span>
    <span><button id="demoBtn">Demo mode</button></span>
  </div>
</div>
<script>
// ANKA's brain view (2026-11-18). Canvas 2D. Seven regions around a shared centre; each region's brightness comes from
// ANKA's real activity (viz/activity.json, written by anka/activity.py) - or, in DEMO mode, from a fixed script.
// Brief events = a pulse that fades back to the idle glow; ongoing activity (walking) stays lit while it runs.
const REGIONS = [
  { id: "vision",    name: "Vision",           rgb: [95, 211, 243] },
  { id: "attention", name: "Attention",        rgb: [185, 167, 255] },
  { id: "goals",     name: "Goals",            rgb: [242, 179, 91] },
  { id: "memory",    name: "Memory",           rgb: [240, 138, 166] },
  { id: "movement",  name: "Movement",         rgb: [127, 224, 181] },
  { id: "feelings",  name: "Feelings",         rgb: [255, 122, 99] },
  { id: "hearing",   name: "Hearing & speech", rgb: [207, 220, 255] },
];
const IDLE = 0.22, FADE_S = 1.6, NODES = 62;

// ---- a fixed, seeded layout (the same every time) -------------------------------------------------------------
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const nodes = [], edges = [];
REGIONS.forEach((reg, k) => {
  const a = -Math.PI / 2 + k * 2 * Math.PI / REGIONS.length;
  reg.cx = Math.cos(a) * 0.30; reg.cy = Math.sin(a) * 0.26;           // centres around the shared middle
  reg.idx = [];
  for (let i = 0; i < NODES; i++) {
    const r = Math.sqrt(rnd()) * 0.20, t = rnd() * 2 * Math.PI;
    const x = reg.cx * 0.92 + Math.cos(t) * r * 1.15, y = reg.cy * 0.92 + Math.sin(t) * r * 0.95;
    reg.idx.push(nodes.length);
    nodes.push({ x, y, k, size: 0.6 + rnd() * 1.6, tw: rnd() * 6.28 });
  }
});
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
nodes.forEach((n, i) => {                                               // each node to its nearest neighbours
  const near = nodes.map((m, j) => [dist(n, m), j]).filter(([d, j]) => j !== i).sort((p, q) => p[0] - q[0]);
  near.slice(0, 3).forEach(([d, j]) => { if (d < 0.11 && i < j) edges.push([i, j]); });
  if (rnd() < 0.05) { const [d, j] = near[3 + Math.floor(rnd() * 5)]; if (i < j) edges.push([i, j]); }
});

// ---- activity -> brightness ------------------------------------------------------------------------------------
let live = { pulses: [], on: {}, sleep: false, text: "", t: 0 };
let demo = new URLSearchParams(location.search).has("demo");
const level = {}; REGIONS.forEach(r => level[r.id] = IDLE);

function liveLevels(now) {
  const out = {}; REGIONS.forEach(r => out[r.id] = IDLE);
  for (const p of live.pulses || []) {
    const age = now - p.t;
    if (age >= 0 && age < FADE_S * 3 && out[p.r] !== undefined)
      out[p.r] = Math.max(out[p.r], IDLE + (1 - IDLE) * p.s * Math.exp(-age / FADE_S * 1.6));
  }
  for (const [r, on] of Object.entries(live.on || {})) if (on && out[r] !== undefined) out[r] = Math.max(out[r], 0.95);
  return out;
}

function demoLevels(now) {                                               // DEMO: Vision, Goals and Movement together
  const out = {}; REGIONS.forEach(r => out[r.id] = IDLE);
  const cyc = now % 10;
  const together = cyc < 6 ? Math.min(1, cyc / 0.6) * (cyc > 5 ? (6 - cyc) : 1) : 0;
  ["vision", "goals", "movement"].forEach(r => out[r] = Math.max(out[r], IDLE + (1 - IDLE) * together));
  const mem = Math.exp(-((cyc - 7.2) ** 2) / 0.15), att = Math.exp(-((cyc - 1.4) ** 2) / 0.2);
  out.memory = Math.max(out.memory, IDLE + 0.7 * mem);
  out.attention = Math.max(out.attention, IDLE + 0.6 * att);
  return out;
}
const DEMO_TEXT = [[0, "ANKA spots a sock."], [2, "He wants to bring it to Alex."], [4, "Walking to the sock…"],
                   [6.5, "Remembering where the sofa is."], [8.5, "ANKA spots a sock."]];

async function poll() {
  if (!demo) {
    try {
      const r = await fetch("activity.json?" + Date.now(), { cache: "no-store" });
      if (r.ok) live = await r.json();
    } catch (e) { live.t = 0; }
  }
  setTimeout(poll, 250);
}

// ---- drawing ---------------------------------------------------------------------------------------------------
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
function resize() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);

const legend = document.getElementById("legend");
REGIONS.forEach(r => {
  const s = document.createElement("span"); s.id = "lg-" + r.id;
  s.innerHTML = `<i style="background:rgb(${r.rgb})"></i>${r.name}`; legend.appendChild(s);
});

function frame() {
  const now = Date.now() / 1000;
  const stale = !demo && (!live.t || now - live.t > 5);
  const target = demo ? demoLevels(now) : stale ? Object.fromEntries(REGIONS.map(r => [r.id, IDLE])) : liveLevels(now);
  const sleeping = !demo && !stale && live.sleep;
  if (sleeping) {                                                       // asleep: dim, with slow dream waves
    REGIONS.forEach(r => target[r.id] = IDLE * 0.6);
    const wave = (Math.sin(now * 0.9) + 1) / 2;
    target.memory = IDLE * 0.6 + 0.45 * wave;
    target.feelings = IDLE * 0.6 + 0.45 * (1 - wave);
  }
  REGIONS.forEach(r => level[r.id] += (target[r.id] - level[r.id]) * 0.18);

  const W = cv.clientWidth, H = cv.clientHeight, S = Math.min(W, H * 1.55) * 0.95;
  const X = x => W / 2 + x * S, Y = y => H / 2 + y * S;
  ctx.clearRect(0, 0, W, H);
  REGIONS.forEach(r => {                                                // soft glow behind each region
    const L = level[r.id], g = ctx.createRadialGradient(X(r.cx), Y(r.cy), 0, X(r.cx), Y(r.cy), S * 0.24);
    g.addColorStop(0, `rgba(${r.rgb},${0.05 + 0.20 * L})`); g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  });
  ctx.lineWidth = 0.6;
  for (const [i, j] of edges) {
    const a = nodes[i], b = nodes[j], ra = REGIONS[a.k], rb = REGIONS[b.k];
    const L = (level[ra.id] + level[rb.id]) / 2, c = ra.rgb.map((v, q) => (v + rb.rgb[q]) / 2);
    ctx.strokeStyle = `rgba(${c},${0.10 + 0.45 * L})`;
    ctx.beginPath(); ctx.moveTo(X(a.x), Y(a.y)); ctx.lineTo(X(b.x), Y(b.y)); ctx.stroke();
  }
  for (const n of nodes) {
    const r = REGIONS[n.k], L = level[r.id], tw = 0.85 + 0.15 * Math.sin(now * 2 + n.tw);
    const lift = r.rgb.map(v => Math.round(v + (255 - v) * L * 0.55));
    ctx.fillStyle = `rgba(${lift},${(0.35 + 0.65 * L) * tw})`;
    ctx.beginPath(); ctx.arc(X(n.x), Y(n.y), n.size * (0.8 + 0.9 * L), 0, 6.283); ctx.fill();
  }
  REGIONS.forEach(r => document.getElementById("lg-" + r.id).style.color =
    level[r.id] > 0.5 ? "#eef3fb" : "#9aa7bd");

  const mode = document.getElementById("mode"), status = document.getElementById("status");
  document.getElementById("demoBtn").classList.toggle("on", demo);
  if (demo) {
    mode.innerHTML = "<b>DEMO MODE</b> – SIMULATED ACTIVITY";
    status.textContent = DEMO_TEXT.filter(([t]) => t <= now % 10).pop()[1];
  } else if (stale) {
    mode.textContent = "LIVE – WAITING FOR ANKA"; status.textContent = "ANKA is not running (or the view can't see him).";
  } else {
    mode.textContent = sleeping ? "LIVE – ASLEEP" : "LIVE";
    status.textContent = live.text || "";
  }
  requestAnimationFrame(frame);
}
document.getElementById("demoBtn").onclick = () => {
  demo = !demo;
  history.replaceState(null, "", demo ? "?demo" : location.pathname);
};
resize(); poll(); frame();
</script>
</body>
</html>
